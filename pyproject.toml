[project]
name = "skillz"
version = "0.1.0"
description = "Agent skills package manager — install, manage, and discover AI agent skills from GitHub."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "kayaman" }]
keywords = ["ai", "agent", "skills", "cli", "cursor", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer[all]>=0.15",
    "pydantic>=2.10",
    "httpx>=0.28",
]

[project.scripts]
skillz = "skillz.cli:app"

[project.urls]
Homepage = "https://github.com/kayaman/skillz"
Repository = "https://github.com/kayaman/skillz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillz"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
